<title>The Rootstock — Word Power</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2230; --ink-soft:#5b6472;
    --parch:#f6f4ef; --parch-deep:#ece9e1;
    --surface:#ffffff; --surface-2:#faf9f5;
    --ox:#9a3442; --ox-bright:#b0404f;
    --gild:#9a7a34; --moss:#3f5b4c;
    --line:#e6e2d8; --shadow:rgba(27,34,48,.10);
    --radius:18px; --radius-sm:12px;
    --sh-sm:0 1px 2px rgba(27,34,48,.04),0 3px 10px rgba(27,34,48,.05);
    --sh-md:0 2px 6px rgba(27,34,48,.05),0 14px 34px rgba(27,34,48,.09);
    --sh-lg:0 24px 60px rgba(27,34,48,.16);
    --ui:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
    --serif:'Newsreader',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--parch);color:var(--ink);font-family:var(--ui);line-height:1.55;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:0 clamp(14px,4.5vw,26px) 40px}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:16px 2px 13px;margin-bottom:2px;
    background:linear-gradient(var(--parch),var(--parch) 66%,rgba(246,244,239,0));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.015em}
  .brand-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;
    background:var(--ink);color:var(--parch);font-size:16px;font-family:var(--serif);font-style:italic;font-weight:600}
  .brand-tag{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft)}

  /* ---- dashboard ---- */
  .dash{margin:6px 0 22px}
  .dash-greet{margin:2px 2px 14px}
  .dash-hello{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:-.02em;line-height:1.08}
  .dash-sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
  .session{display:block;width:100%;text-align:left;cursor:pointer;border:none;font-family:var(--ui);
    background:var(--ink);color:var(--parch);border-radius:var(--radius);padding:20px 20px 22px;
    box-shadow:var(--sh-md);position:relative;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease}
  .session::after{content:"";position:absolute;right:-46px;top:-46px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(176,64,79,.30),rgba(176,64,79,0) 70%);pointer-events:none}
  .session:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--sh-lg)}
  .session:active:not(:disabled){transform:translateY(0)}
  .session:disabled{cursor:default;opacity:.92}
  .session-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;position:relative}
  .session-kicker{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(246,244,239,.6)}
  .session-arrow{width:34px;height:34px;border-radius:50%;background:rgba(246,244,239,.13);
    display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--parch)}
  .session-title{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.12;letter-spacing:-.015em;margin-bottom:5px;position:relative}
  .session-meta{font-size:13.5px;color:rgba(246,244,239,.66);max-width:40ch;position:relative;line-height:1.4}
  .session-bar{height:5px;border-radius:3px;background:rgba(246,244,239,.16);overflow:hidden;margin-top:16px;position:relative}
  .session-bar>i{display:block;height:100%;background:var(--parch);border-radius:3px;transition:width .5s ease}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 8px 11px;text-align:center;box-shadow:var(--sh-sm)}
  .stat-n{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1;color:var(--ink)}
  .stat-n span{font-size:12px;color:var(--ink-soft);font-weight:500}
  .stat-l{font-size:10px;color:var(--ink-soft);margin-top:6px;letter-spacing:.01em;line-height:1.2}
  .stat.due .stat-n{color:var(--ox)}
  button.stat{width:100%;display:block;font:inherit;transition:transform .12s,box-shadow .12s,border-color .12s}
  button.stat:not(:disabled):hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--ox)}
  button.stat:disabled{opacity:1}

  /* ---- the curriculum ---- */
  .index{margin-top:6px}
  .index-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:6px 2px 12px}
  .lvl-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;cursor:pointer;
    font-family:var(--ui);color:inherit;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .12s}
  .lvl-card:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--sh-md)}
  .lvl-card:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;background:var(--surface-2)}
  .lvl-card.bar-card{background:linear-gradient(180deg,#fffdf7,#fbf6ea);border-color:#e8dcbe}
  .lvl-num{font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px;color:var(--ox);
    flex:none;width:44px;height:44px;border-radius:12px;background:rgba(154,52,66,.08);
    display:flex;align-items:center;justify-content:center}
  .lvl-body{flex:1;min-width:0}
  .lvl-body h3{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.15;letter-spacing:-.01em}
  .lvl-body p{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lvl-seal{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gild);
    white-space:nowrap;text-align:right;flex:none}
  .lvl-seal.done{color:var(--moss)} .lvl-seal.locked{color:var(--ink-soft);opacity:.85}
  .lvl-card.sealed{padding:11px 16px;background:var(--surface-2);gap:12px}
  .lvl-card.sealed .lvl-body p{display:none}
  .lvl-card.sealed .lvl-body h3{font-size:15px;color:var(--ink-soft)}
  .lvl-card.sealed .lvl-num{width:38px;height:38px;font-size:14px;background:rgba(63,91,76,.10);color:var(--moss)}
  .lvl-card.sealed:hover:not(:disabled){transform:none;box-shadow:var(--sh-sm)}
  .stamp{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--moss);border:1px solid rgba(63,91,76,.4);border-radius:20px;padding:4px 10px 3px;white-space:nowrap}

  .lex-bar{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 16px;margin:0 0 10px;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
    box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .12s,color .12s}
  .lex-bar .ct{letter-spacing:.01em;text-transform:none;font-family:var(--ui);font-size:12px}
  .lex-bar:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh-md);color:var(--ink)}
  .lex-bar:disabled{cursor:default;opacity:.7;box-shadow:none;background:var(--surface-2)}

  .queue-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 2px 14px}
  .queue-meta .debt{color:var(--ox)}

  /* ---- panel / stage ---- */
  .panel{margin-top:2px;animation:panel-in .34s cubic-bezier(.2,.7,.2,1)}
  @keyframes panel-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .back{background:var(--surface);border:1px solid var(--line);border-radius:20px;font-family:var(--ui);
    font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;padding:7px 15px;margin-bottom:16px;
    box-shadow:var(--sh-sm);transition:color .12s,transform .12s}
  .back:hover{color:var(--ox);transform:translateX(-2px)}
  .stage-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ox);text-align:center;margin-bottom:4px}
  .stage-title{font-family:var(--serif);font-weight:600;font-size:clamp(24px,6.5vw,32px);text-align:center;line-height:1.05;letter-spacing:-.02em;margin-bottom:16px}
  .theme{text-align:center;font-family:var(--serif);font-style:italic;color:var(--ink-soft);max-width:44ch;margin:0 auto 22px;font-size:16px;line-height:1.5}

  .root-row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;padding:13px 6px;border-bottom:1px solid var(--line)}
  .root-row:first-of-type{border-top:1px solid var(--line)}
  .root-key{font-family:var(--mono);font-weight:500;font-size:16px;color:var(--ox)}
  .root-lang{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gild);display:block;margin-top:3px}
  .root-gloss{font-family:var(--serif);font-size:16.5px}
  .root-gloss::before{content:"\201C"} .root-gloss::after{content:"\201D"}

  /* ---- word card ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--sh-md);padding:clamp(22px,6vw,32px);text-align:center}
  .headword{font-family:var(--serif);font-weight:600;font-size:clamp(34px,9.5vw,50px);line-height:1;letter-spacing:-.025em}
  .pron{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin-top:9px;letter-spacing:.02em}
  .morph{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:22px 0}
  .seg{position:relative;padding:10px 13px 23px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);min-width:46px}
  .seg .sy{font-family:var(--mono);font-weight:500;font-size:17px;color:var(--ink)}
  .seg .mn{position:absolute;left:0;right:0;bottom:6px;font-size:9.5px;font-family:var(--mono);color:var(--ox);text-transform:lowercase;letter-spacing:.02em}
  .seg.empty{opacity:.4}
  .plus{align-self:center;color:var(--gild);font-family:var(--serif);font-size:18px}
  .def{font-family:var(--serif);font-size:19px;margin:8px auto 4px;max-width:40ch;line-height:1.45}
  .exline{font-family:var(--serif);font-style:italic;color:var(--ink-soft);max-width:44ch;margin:16px auto 0;padding-top:16px;border-top:1px solid var(--line);font-size:16px;line-height:1.55}
  .near{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--gild);margin-top:16px;text-transform:uppercase}

  /* ---- buttons ---- */
  .btn{display:inline-block;font-family:var(--ui);font-size:14px;font-weight:600;letter-spacing:.01em;cursor:pointer;
    padding:13px 26px;border:1.5px solid var(--ink);border-radius:26px;background:var(--ink);color:var(--parch);
    box-shadow:var(--sh-sm);transition:background .14s,color .14s,transform .12s,box-shadow .14s}
  .btn:hover{background:var(--ox);border-color:var(--ox);transform:translateY(-2px);box-shadow:var(--sh-md)}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-color:var(--line)}
  .btn.ghost:hover{background:var(--surface);color:var(--ox);border-color:var(--ox)}
  .btn:disabled{opacity:.4;cursor:default;transform:none;background:var(--ink);box-shadow:none}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}

  /* ---- prompt / quiz ---- */
  .prompt{text-align:center;margin-bottom:8px}
  .prompt .q-word{font-family:var(--serif);font-weight:600;font-size:clamp(28px,7.5vw,42px);letter-spacing:-.02em}
  .prompt .q-def{font-family:var(--serif);font-size:19px;max-width:42ch;margin:4px auto 0;line-height:1.4}
  .prompt .q-sentence{font-family:var(--serif);font-size:18px;font-style:italic;max-width:46ch;margin:4px auto 0;line-height:1.5}
  .prompt .q-sentence b{font-style:normal;letter-spacing:.1em;color:var(--ox)}
  .prompt .q-ask{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ox);margin-bottom:10px}
  .prompt .review-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gild);margin-bottom:6px}
  .cue{font-family:var(--mono);font-size:15px;letter-spacing:.3em;color:var(--ox);margin-top:12px}
  .card .ety{font-family:var(--serif);font-size:13.5px;font-style:italic;color:var(--ox);margin-top:10px;line-height:1.55;border-top:1px solid rgba(20,20,20,.09);padding-top:9px}
  .verdict .fb-line{display:block;margin-top:7px;font-size:13px;line-height:1.5;font-weight:400}
  .verdict .fb-ety,.verdict .fb-scene{font-style:italic;opacity:.88}
  .choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .choice{text-align:left;font-family:var(--serif);font-size:16px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--sh-sm);
    transition:border-color .12s,background .12s,transform .1s,box-shadow .12s;display:flex;gap:12px;align-items:flex-start}
  .choice:hover:not(.locked){border-color:var(--ox);transform:translateY(-1px);box-shadow:var(--sh-md)}
  .choice .mark{font-family:var(--mono);color:var(--ox);font-weight:500;flex-shrink:0}
  .choice.correct{background:rgba(63,91,76,.10);border-color:var(--moss)}
  .choice.correct .mark{color:var(--moss)}
  .choice.wrong{background:rgba(154,52,66,.09);border-color:var(--ox)}
  .choice.locked{cursor:default}
  .typebox{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .typebox input{font-family:var(--mono);font-size:17px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--ink);width:min(340px,100%);letter-spacing:.02em;box-shadow:var(--sh-sm)}
  .typebox input:focus{outline:none;border-color:var(--ox);box-shadow:0 0 0 3px rgba(154,52,66,.14)}
  .typebox input.ok{border-color:var(--moss);background:rgba(63,91,76,.08)}
  .typebox input.bad{border-color:var(--ox);background:rgba(154,52,66,.07)}
  .verdict{text-align:center;margin-top:18px;min-height:26px;font-family:var(--serif);font-style:italic;font-size:16px}
  .verdict.right{color:var(--moss)} .verdict.wrong{color:var(--ox)}
  .verdict .root-hint{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);display:block;margin-top:5px}

  /* ---- seal / graduation ---- */
  .seal-wrap{text-align:center;padding:22px 0}
  .wax{width:112px;height:112px;margin:0 auto 22px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,var(--ox-bright),var(--ox) 58%,#6d222c 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 34px rgba(154,52,66,.32),inset 0 2px 10px rgba(255,255,255,.22);position:relative}
  .wax::before{content:"";position:absolute;inset:9px;border:1.5px solid rgba(246,244,239,.45);border-radius:50%}
  .wax.gold{background:radial-gradient(circle at 38% 32%,#c6a24a,var(--gild) 58%,#6f561f 100%);box-shadow:0 14px 34px rgba(154,122,52,.34),inset 0 2px 10px rgba(255,255,255,.28)}
  .wax span{font-family:var(--serif);font-style:italic;font-weight:600;font-size:30px;color:var(--parch)}
  .grad-score{font-family:var(--mono);letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;font-size:11px;margin-bottom:8px}
  .grad-title{font-family:var(--serif);font-weight:600;font-size:clamp(24px,6.5vw,32px);letter-spacing:-.015em;margin-bottom:9px}
  .grad-note{font-family:var(--serif);font-style:italic;color:var(--ink-soft);max-width:38ch;margin:0 auto 8px;font-size:16px;line-height:1.55}
  .temper-clock{font-family:var(--mono);font-size:26px;letter-spacing:.06em;color:var(--ox);margin:12px 0 6px}

  .fine{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:34px;opacity:.6}
  .sbar{height:6px;background:var(--parch-deep);border-radius:100px;overflow:hidden;margin:2px 2px 14px}
  .sfill{height:100%;background:var(--ox);border-radius:100px;transition:width .3s ease}
  .restore-link{display:block;width:100%;text-align:center;background:none;border:none;cursor:pointer;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
    opacity:.6;margin-top:12px;padding:8px;transition:opacity .15s,color .15s}
  .restore-link:hover{opacity:1;color:var(--ox)}

  /* ---- lexicon ---- */
  .lex-list{display:flex;flex-direction:column;gap:5px}
  .lex-row{display:flex;align-items:baseline;gap:10px;text-align:left;background:none;border:none;border-radius:10px;
    border-bottom:1px solid var(--line);padding:11px 8px;cursor:pointer;font-family:var(--serif);color:var(--ink)}
  .lex-row:hover{background:var(--surface)}
  .lex-w{font-weight:600;font-size:16px;white-space:nowrap}
  .lex-d{font-size:13px;color:var(--ink-soft);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .lex-led{font-family:var(--mono);font-size:10.5px;color:var(--moss)}
  .lex-led.bad{color:var(--ox)}
  #lexq{width:100%;font-family:var(--serif);font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
  #lexq:focus{outline:none;border-color:var(--ox)}

  /* ---- ghost glosses (inline, not buttons) ---- */
  .ghost:not(.btn){background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;border-bottom:1px dotted var(--gild)}
  .ghost:not(.btn):hover{color:var(--ox)}
  .ghost-note{font-family:var(--mono);font-size:11px;font-style:normal;color:var(--ink-soft);margin-top:9px;padding-top:7px;border-top:1px dotted var(--gild)}

  /* ---- prediction veil ---- */
  .veiled{filter:blur(7px);pointer-events:none;user-select:none;transition:filter .18s}
  .veil-prompt{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px auto 0;cursor:pointer;
    font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:8px;width:fit-content}
  .veil-prompt input[type=checkbox]{width:14px;height:14px;accent-color:var(--ox);cursor:pointer;margin:0}
  .veil-prompt:hover{opacity:.75}

  /* ---- compose chips ---- */
  .built{min-height:40px;display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:wrap;
    border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;margin:14px 0 4px;font-family:var(--mono);font-size:17px}
  .built.ok{border-color:var(--moss);background:rgba(63,91,76,.08)}
  .built.bad{border-color:var(--ox);background:rgba(154,52,66,.07)}
  .bseg{padding:2px 3px}
  .chipbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
  .chip{font-family:var(--mono);font-size:15px;padding:9px 15px;background:var(--surface);border:1.5px solid var(--ink);
    border-radius:10px;cursor:pointer;color:var(--ink);box-shadow:var(--sh-sm);transition:all .12s}
  .chip:hover:not(:disabled){background:var(--ink);color:var(--parch);transform:translateY(-1px)}
  .chip:disabled{opacity:.3;cursor:default;box-shadow:none}

  /* ---- modal ---- */
  .modal-scrim{position:fixed;inset:0;background:rgba(27,34,48,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:panel-in .2s ease}
  .modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--sh-lg);max-width:440px;width:100%;padding:clamp(22px,5vw,30px);text-align:center}
  .modal h3{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:-.015em;margin-bottom:7px}
  .modal p{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:15px;margin:0 auto 16px;max-width:34ch;line-height:1.5}
  .modal textarea{width:100%;height:84px;font-family:var(--mono);font-size:11px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);resize:none;margin-bottom:14px;word-break:break-all}
  .modal .actions{margin-top:4px}
  .modal .msg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-height:18px;margin-top:10px}
  .modal .msg.ok{color:var(--moss)} .modal .msg.bad{color:var(--ox)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid var(--ox);outline-offset:2px}
</style>
</head>

<script>
const app = document.getElementById('app');
const KEY = 'rootstock_v2';
// Tempering unlocks after a night's sleep: first 4 AM local strictly after (t1 + 8h floor).
const TEMPER_MIN_MS = 8 * 60 * 60 * 1000, TEMPER_WAKE_HR = 4;
function temperUnlock(t1){
  const d = new Date(t1);
  d.setHours(TEMPER_WAKE_HR, 0, 0, 0);
  if(d.getTime() <= t1) d.setDate(d.getDate() + 1);   // next 4 AM strictly after t1
  return Math.max(d.getTime(), t1 + TEMPER_MIN_MS);   // but never less than an 8h floor

}
const BAR_SIZE = 50, BAR_PASS = 45;
const DAY = 24*60*60*1000;
const INTERVALS = [2*DAY, 5*DAY, 12*DAY, 30*DAY]; // Leitner boxes 0..3

function load(){ try{ let raw = localStorage.getItem(KEY);
  if(!raw){ const bak=localStorage.getItem(KEY+'_bak'); if(bak){ const o=deserialize(bak); if(o) raw=JSON.stringify(o); } }
  const p = JSON.parse(raw) || {}; p.gates=p.gates||{}; p.bar=p.bar||{passed:false,lockedUntil:0}; p.review=p.review||{}; p.prompted=p.prompted||{}; p.seenInfer=p.seenInfer||{}; p.predict=p.predict!==false; p.ledger=p.ledger||{}; p.mark=p.mark||null; return p; }catch(e){ return {gates:{},bar:{passed:false,lockedUntil:0},review:{},prompted:{},seenInfer:{},predict:true,ledger:{},mark:null}; } }
function stageBar(frac){ const pct=Math.round(Math.min(1,Math.max(0,frac))*100); return `<div class="sbar"><div class="sfill" style="width:${pct}%"></div></div>`; }
// gated inference sampling: eligible by req, fresh-first
function inferPick(idx,n){
  const el = INFER_POOL.filter(f=>f.req<=idx);
  const fresh = shuffle(el.filter(f=>!P.seenInfer[f.word]));
  const pick = fresh.slice(0,n);
  if(pick.length<n) pick.push(...shuffle(el.filter(f=>!pick.includes(f))).slice(0,n-pick.length));
  return pick;
}
// normalized root-token set per gate (cached) — for affinity-scored review
const _grk={};
function gateRootKeys(gi){
  if(!_grk[gi]){ const s=new Set();
    LEVELS[gi].roots.forEach(r=>r.root.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .split(/[^a-z]+/).forEach(t=>{ if(t.length>2) s.add(t); }));
    _grk[gi]=s; }
  return _grk[gi];
}
// sitting-scoped fill: cleared items over (cleared + remaining this sitting)
function sitBar(){ if(!S||S.sit===undefined) return stageBar(0);
  const remaining = S.queue.length + S.sit.ahead;   // ahead = fixed size of stages not yet entered
  return stageBar(S.sit.cleared/(S.sit.cleared+remaining || 1)); }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); localStorage.setItem(KEY+'_bak', serialize()); }catch(e){} }
let P = load();
function G(id){ if(!P.gates[id]) P.gates[id]={t1:0,sealed:false}; return P.gates[id]; }
function rom(n){ if(!(n>0))return n; const T=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s=''; for(const[v,r]of T){ while(n>=v){ s+=r; n-=v; } } return s; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function rootHint(w){ return w.parts.filter(p=>p[1]).map(p=>p[0]+'='+p[1]).join('  ·  '); }
function blank(w){ const re=new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'); return esc(w.sentence).replace(re,'<b>＿＿＿＿</b>'); }
function depthOf(w){ return (window.DEPTH && window.DEPTH[w.word]) || {}; }
function vigOf(w){ return depthOf(w).v || ''; }
function etyOf(w){ return depthOf(w).e || ''; }
function defOfWord(name){ for(const l of LEVELS){ const x=l.words.find(t=>t.word===name); if(x) return x.def; } return ''; }
function letterCue(word){ return word[0] + word.slice(1).replace(/[^ ]/g,'·'); }
function allSealed(){ return LEVELS.every(l=>G(l.id).sealed); }
function fmtDur(ms){ const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function fmtDays(ms){ const d=ms/DAY; return d>=1 ? Math.round(d)+'d' : fmtDur(ms); }
function wordAt(gi,wi){ return LEVELS[gi].words[wi]; }
function tally(gi,wi,ok){ const k=gi+'-'+wi; const t=P.ledger[k]||(P.ledger[k]={r:0,w:0}); ok?t.r++:t.w++; save(); }
function gateIdxOfWord(name){ for(let gi=0;gi<LEVELS.length;gi++){ const wi=LEVELS[gi].words.findIndex(w=>w.word.toLowerCase()===name.toLowerCase()); if(wi>=0) return gi; } return -1; }
function gateOfForm(form){
  const t=form.toLowerCase();
  let best=-1, bestLen=0;
  LEVELS.forEach((l,gi)=>l.words.forEach(w=>{
    const h=w.word.toLowerCase();
    const stem = h.endsWith('e') ? h.slice(0,-1) : h;   // vacillate → vacillat(ed)
    if((t===h || t.startsWith(h) || t.startsWith(stem)) && h.length>bestLen){ best=gi; bestLen=h.length; }
  }));
  return best;
}
function pairEligible(pair, maxGi){
  const A=gateOfForm(pair.a), B=gateOfForm(pair.b);
  return A>=0 && B>=0 && A<=maxGi && B<=maxGi;
}

/* ---- Review Docket (Leitner) ---- */
function enqueueGateReview(gi){
  LEVELS[gi].words.forEach((_,wi)=>{ const k=gi+'-'+wi;
    if(!P.review[k]) P.review[k]={box:0, due:Date.now()+INTERVALS[0]}; });
  save();
}
function dueKeys(){ const now=Date.now(); return Object.keys(P.review).filter(k=>P.review[k].due<=now); }
function nextDueMs(){ const t=Object.values(P.review).map(r=>r.due); return t.length? Math.min(...t)-Date.now() : Infinity; }

let S=null, clockTimer=null;
function stopClock(){ if(clockTimer){clearInterval(clockTimer);clockTimer=null;} }

/* ---- Finger on the page: same-sitting bookmark ----
   Leaving for the home page mid-gate keeps your place. The mark lives for
   MARK_TTL (one "sitting"); return later than that and the stage restarts
   from its own beginning — never further back. Docket, Bar, and Forge are
   deliberately unmarked: the Docket persists per answer, the Bar is one
   attempt, the Forge rebuilds itself from the tallies. */
const MARK_TTL = 3*60*60*1000;   // 3h resume window — tune here
function markFresh(mk){ return !!mk && (Date.now()-mk.t) <= MARK_TTL; }
function itemOut(it){ const o={m:it.m};
  if(it.gi!==undefined){ o.gi=it.gi; o.wi=it.wi; }
  if(it.pair){ o.pi=CONFUSABLES.indexOf(it.pair); }
  if(it.inf){ o.fw=it.inf.word; }
  return o; }
function itemIn(o){ const it={m:o.m==='BLANK'?'VIG':o.m};
  if(o.gi!==undefined){ it.gi=o.gi; it.wi=o.wi; }
  if(o.pi!==undefined){ it.pair=CONFUSABLES[o.pi]; if(!it.pair) return null; }
  if(o.fw){ it.inf=INFER_POOL.find(f=>f.word===o.fw); if(!it.inf) return null; }
  if(o.m==='PAIR'&&!it.pair) return null;
  if(o.m==='INFER'&&!it.inf) return null;
  return it; }
function setMark(mk){ mk.t=Date.now(); P.mark=mk; save(); }
function clearMark(idx){ if(P.mark && (idx===undefined || P.mark.idx===idx)){ P.mark=null; save(); } }
function markSit(stage){ if(!S || S.idx===undefined) return;
  setMark({stage, idx:S.idx, kind:S.kind||'T1',
    q: stage==='roots' ? S.queue.slice() : S.queue.map(itemOut),
    debt:S.debt||0, done:S.done||0,
    sit: S.sit ? {cleared:S.sit.cleared, ahead:S.sit.ahead, studyEntered:S.sit.studyEntered} : undefined,
    missed: S.missed ? S.missed.slice() : undefined}); }
function markUsable(mk,g){ return mk.kind==='T2' ? (!!g.t1 && temperUnlock(g.t1)-Date.now()<=0) : !g.t1; }
function resumeMark(mk,idx){
  if(mk.stage==='study'){
    S={idx, queue:[], debt:0, done:0, sit: mk.sit||{cleared:0,ahead:0,studyEntered:true}, studyLeft: mk.studyLeft||0};
    return studyScreen(idx, Math.min(mk.w||0, LEVELS[idx].words.length-1)); }
  if(mk.stage==='roots'){
    S={idx, queue:mk.q.slice(), debt:mk.debt||0, done:mk.done||0, sit: mk.sit||{cleared:0,ahead:0}};
    return rootDrillItem(); }
  const queue=(mk.q||[]).map(itemIn).filter(Boolean);
  if(!queue.length){ clearMark(idx); return enterGate(idx); }
  S={idx, kind:mk.kind, queue, debt:mk.debt||0, done:mk.done||0,
     sit: mk.sit||{cleared:0,ahead:0}, studyLeft:0, missed: mk.missed||[]};
  return trialItem(); }

/* ---- daily streak (device-local) ---- */
function touchStreak(){
  const today=new Date(); today.setHours(0,0,0,0); const t0=today.getTime();
  if(P.lastActive===undefined||P.lastActive===null){ P.streak=1; P.lastActive=t0; save(); return; }
  if(P.lastActive===t0) return;
  const diff=Math.round((t0-P.lastActive)/DAY);
  if(diff===1) P.streak=(P.streak||0)+1;
  else if(diff>1) P.streak=1;
  P.lastActive=t0; save();
}

/* ---- the one next thing: drives the home session card ---- */
function primaryAction(due, debtBlocks){
  const mk=P.mark;
  if(mk && markFresh(mk) && LEVELS[mk.idx]){ const g=G(LEVELS[mk.idx].id);
    if(!g.sealed && markUsable(mk,g))
      return {kicker:'Resume', label:'Gate '+rom(LEVELS[mk.idx].id)+' \u00b7 '+LEVELS[mk.idx].title, sub:'Pick up where you left off', fn:()=>enterGate(mk.idx)};
  }
  if(due>0) return {kicker:'Review', label:'The Review Docket', sub:due+' word'+(due>1?'s':'')+' ready for recall', fn:startReview};
  for(let idx=0; idx<LEVELS.length; idx++){
    const g=G(LEVELS[idx].id); if(g.sealed) continue;
    const prevSealed = idx===0 || G(LEVELS[idx-1].id).sealed;
    if(!prevSealed) break;
    if(g.t1){ const left=temperUnlock(g.t1)-Date.now();
      if(left>0) return {kicker:'Tempering', label:'Gate '+rom(LEVELS[idx].id)+' is setting', sub:'Trial II opens in '+fmtDur(left), fn:null};
      return {kicker:'Trial II', label:'Gate '+rom(LEVELS[idx].id)+' \u00b7 '+LEVELS[idx].title, sub:'Typed production \u2014 seal the gate', fn:()=>enterGate(idx)};
    }
    if(debtBlocks) return {kicker:'Review', label:'Clear the Docket first', sub:'Due words gate the next opening', fn:startReview};
    return {kicker: idx===0?'Begin':'Next Gate', label:'Gate '+rom(LEVELS[idx].id)+' \u00b7 '+LEVELS[idx].title, sub:LEVELS[idx].theme, fn:()=>enterGate(idx)};
  }
  if(P.bar.passed) return {kicker:'Admitted \u2726', label:'The method is yours', sub:'Revisit the Forge or your Lexicon anytime', fn:null};
  if(debtBlocks) return {kicker:'Review', label:'The Review Docket', sub:'Clear the docket, then the Bar sits open', fn:startReview};
  if(P.bar.lockedUntil>Date.now()) return {kicker:'The Bar', label:'Doors locked', sub:'Reopens in '+fmtDur(P.bar.lockedUntil-Date.now()), fn:null};
  return {kicker:'The Bar', label:'The Bar sits open', sub:'Fifty items \u00b7 '+BAR_PASS+' to pass \u00b7 one attempt', fn:startBar};
}

/* ================= HOME ================= */
function home(){
  stopClock(); S=null; P=load();
  const sealedCt = LEVELS.filter(l=>G(l.id).sealed).length;
  const due = dueKeys().length;
  const debtBlocks = due>0;

  // Review Docket: quiet strip when clear; asserts itself only when words are due
  let docket='';
  if(Object.keys(P.review).length){

    }
  }

  let cards = LEVELS.map((lv,idx)=>{

    else if(!prevSealed) seal='<span class="lvl-seal locked">Locked</span>';

           ? '<span class="lvl-seal">In progress</span>' : '<span class="lvl-seal">Open</span>';
    return `<button class="lvl-card${g.sealed?' sealed':''}" ${unlocked?'':'disabled'} data-lvl="${idx}">
      <div class="lvl-num">${rom(lv.id)}</div>
      <div class="lvl-body"><h3>${lv.title}</h3><p>${lv.theme}</p></div>${seal}</button>`;
  }).join('');

  const barReady = allSealed() && !debtBlocks;

    : !allSealed() ? `<span class="lvl-seal locked">Seal all ${LEVELS.length} gates</span>`
    : debtBlocks ? '<span class="lvl-seal locked">Docket first</span>'
    : barLocked ? '<span class="lvl-seal locked">Locked<br>'+fmtDur(P.bar.lockedUntil-Date.now())+'</span>'
    : '<span class="lvl-seal">Sitting open</span>';
  cards += `<button class="lvl-card bar-card" ${barReady&&!barLocked&&!P.bar.passed?'':'disabled'} id="bar-btn">
    <div class="lvl-num" style="color:var(--gild)">☙</div>
    <div class="lvl-body"><h3>The Bar</h3><p>Fifty items: forty produced from memory, five confusable pairs, five words you have never seen — meanings built from roots alone. ${BAR_PASS} to pass; one attempt, then an eight-hour lock.</p></div>${barSeal}</button>`;

  touchStreak();
  const lexCount = lexEntries().length;
  const pa = primaryAction(due, debtBlocks);
  const hr = new Date().getHours();
  const greeting = hr<5?'Burning the midnight oil':hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const sealPct = Math.round(sealedCt/LEVELS.length*100);
  const dashHtml = `<section class="dash">
    <div class="dash-greet"><div class="dash-hello">${greeting}.</div>
      <div class="dash-sub">${sealedCt?sealedCt+' of '+LEVELS.length+' gates sealed':'Twenty-five gates await their first root.'}</div></div>
    <button class="session" id="cta" ${pa.fn?'':'disabled'}>
      <div class="session-top"><span class="session-kicker">${pa.kicker}</span><span class="session-arrow">→</span></div>
      <div class="session-title">${pa.label}</div>

      <div class="stat"><div class="stat-n">${sealedCt}<span>/${LEVELS.length}</span></div><div class="stat-l">Sealed</div></div>

      <button class="stat" id="lex-stat"${lexCount?'':' disabled'} style="font-family:var(--ui);cursor:${lexCount?'pointer':'default'}"><div class="stat-n">${lexCount}</div><div class="stat-l">Lexicon</div></button>

    <button class="restore-link" id="backup" style="margin-top:2px">⛃ Get a backup code for your progress</button>
    <button class="restore-link" id="restore" style="margin-top:2px">⟲ Restore progress from a saved code</button>
    </section>`;

  document.querySelectorAll('.lvl-card[data-lvl]:not(:disabled)').forEach(b=>{ b.onclick=()=>enterGate(+b.dataset.lvl); });
  const db=document.getElementById('docket-btn'); if(db && !db.disabled) db.onclick=startReview;
  const bb=document.getElementById('bar-btn'); if(bb && !bb.disabled) bb.onclick=startBar;
  document.getElementById('restore').onclick=restoreModal;
  document.getElementById('backup').onclick=backupModal;

  const fg=document.getElementById('forge-btn'); if(fg) fg.onclick=startForge;
  const cta=document.getElementById('cta'); if(cta && pa.fn) cta.onclick=pa.fn;

  if(LEVELS.some(l=>{const g=G(l.id);return g.t1&&!g.sealed;}) || barLocked){
    clockTimer=setInterval(()=>{ if(!S) home(); },1000);
  }

}

/* ================= REVIEW DOCKET SESSION ================= */
function startReview(){
  stopClock();
  const keys = dueKeys();
  if(!keys.length) return home();
  const items = keys.map(k=>{ const [gi,wi]=k.split('-').map(Number); return {k,gi,wi}; });
  S = { kind:'DOCKET', queue: shuffle(items), debt:0, done:0, sit:{cleared:0,ahead:0} };
  reviewItem();
}
function reviewItem(){
  if(S.queue.length===0){
    save();
    return sealScreen({seal:'⚖',title:'Docket Cleared',score:(S.debt?S.debt+' lapses reset':'no lapses'),
      note:'Every due word answered. Lapsed words return in two days; the rest climb the calendar.',
      actions:'<button class="btn" id="h2">Return to the gates</button>'}) || (document.getElementById('h2').onclick=home);
  }
  const it=S.queue[0], w=wordAt(it.gi,it.wi);
  // retrieval depth escalates with the Leitner box: recognize → spell in context → produce → assemble
  const MODES=['REC','VIG','VIGT','COMPOSE'];
  it.m = MODES[Math.min(P.review[it.k].box, MODES.length-1)];
  renderTrialPrompt({
    label:'The Review Docket', gateLabel:'Gate '+rom(LEVELS[it.gi].id)+' · box '+(P.review[it.k].box+1), it, w,
    onResolve: ok=>{
      const r=P.review[it.k];
      tally(it.gi,it.wi,ok);
      if(ok){ S.queue.shift(); S.done++; if(S.sit)S.sit.cleared++; r.box=Math.min(r.box+1,INTERVALS.length-1); r.due=Date.now()+INTERVALS[r.box]; }
      else { const f=S.queue.shift(); S.queue.push(f); S.debt++; r.box=0; r.due=Date.now()+INTERVALS[0]; }
      save();
      return ok?null:'lapse — box reset to two days; it returns this session until correct';
    },
    onNext: reviewItem
  });
}

/* ================= GATE ROUTER ================= */
function enterGate(idx){
  stopClock();
  const lv=LEVELS[idx], g=G(lv.id);
  if(g.sealed) return sealedGateView(idx);
  const mk=P.mark;
  if(mk && mk.idx===idx){
    if(markFresh(mk) && markUsable(mk,g)) return resumeMark(mk,idx);
    clearMark(idx);   // lapsed — soft return to the start of this stage, never further back
  }
  if(g.t1){ const left=temperUnlock(g.t1)-Date.now();
    if(left>0) return temperScreen(idx); return startTrial2(idx); }
  return rootsScreen(idx);
}

function rootsScreen(idx){
  const lv=LEVELS[idx];
  const rows=lv.roots.map(r=>`<div class="root-row">
    <div><span class="root-key">${r.root}</span><span class="root-lang">${r.lang}</span></div>
    <div class="root-gloss">${r.gloss}</div></div>`).join('');
  app.innerHTML=`<section class="panel">
    <button class="back" id="home">← The Gates</button>
    <div class="stage-label">Gate ${rom(lv.id)} · The Roots</div>
    <div class="stage-title">${lv.title}</div>
    <p class="theme">${lv.theme}</p>${rows}
    <div class="actions"><button class="btn" id="go">Prove the roots →</button></div></section>`;
  document.getElementById('home').onclick=home;
  document.getElementById('go').onclick=()=>rootDrill(idx);
}

function rootDrill(idx){
  const lv=LEVELS[idx], W=lv.words.length;
  S={idx,queue:shuffle(lv.roots.map((_,i)=>i)),debt:0,done:0,sit:{cleared:0,ahead:W+3*W}};
  rootDrillItem();
}
function rootDrillItem(){
  const lv=LEVELS[S.idx];
  if(S.queue.length===0) return studyScreen(S.idx,0);
  markSit('roots');
  const ri=S.queue[0], r=lv.roots[ri];
  const seen=new Set([r.gloss]); const others=[];
  for(const o of shuffle(lv.roots.filter((_,i)=>i!==ri))){ if(seen.has(o.gloss)) continue; seen.add(o.gloss); others.push(o.gloss); if(others.length===3) break; }
  const opts=shuffle([{t:r.gloss,ok:true},...others.map(t=>({t,ok:false}))]);
  const L=['A','B','C','D'];
  app.innerHTML=`<section class="panel">
    <button class="back" id="home">← The Gates</button>
    <div class="stage-label">Gate ${rom(lv.id)} · Root Drill</div>
    ${sitBar()}
    <div class="queue-meta"><span>${S.queue.length} in queue</span><span class="debt">${S.debt?'+'+S.debt+' penalty reps':''}</span></div>
    <div class="prompt"><div class="q-ask">What does the root mean?</div>
      <div class="q-word" style="font-family:'IBM Plex Mono',monospace;font-weight:500">${r.root}</div>
      <div class="grad-score">${r.lang}</div></div>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" data-ok="${o.ok}"><span class="mark">${L[i]}</span><span>${o.t}</span></button>`).join('')}</div>
    <div class="verdict" id="v"></div><div class="actions" id="a"></div></section>`;
  document.getElementById('home').onclick=home;
  applyVeil();
  wireChoices(ok=>{
    const v=document.getElementById('v');
    if(ok){ S.queue.shift(); S.done++; S.sit.cleared++; v.className='verdict right'; v.textContent='Correct.';
      const sess=S; setTimeout(()=>{ if(S===sess) rootDrillItem(); },350); }
    else { S.queue.push(S.queue.shift()); S.queue.push(ri); S.debt++;
      v.className='verdict wrong'; v.textContent='No — it returns to the queue, with a penalty rep.';
      document.getElementById('a').innerHTML=`<button class="btn" id="n">${S.queue.length?'Next →':'To the words →'}</button>`;
      document.getElementById('n').onclick=rootDrillItem;
      document.getElementById('n').focus(); }
  });
}

function cardHtml(word){
  const morph=word.parts.map((p,i)=>{
    const seg=`<div class="seg ${p[1]===''?'empty':''}"><div class="sy">${p[0]}</div>${p[1]?`<div class="mn">${p[1]}</div>`:''}</div>`;
    return i<word.parts.length-1?seg+'<span class="plus">+</span>':seg;}).join('');
  const kin=word.kin?`<div class="near">kin: ${word.kin.join(' · ')}</div>`:'';
  return `<div class="card"><div class="headword">${word.word}</div><div class="pron">/ ${word.pron} /</div>
    <div class="morph">${morph}</div><div class="def">${word.def}</div>
    <div class="exline">“${ghostify(word)}”<div class="ghost-note" style="display:none"></div></div>${etyOf(word)?`<div class="ety">${etyOf(word)}</div>`:''}${kin}</div>`;
}
// Wrap earlier-gate headwords found in the sentence: tap to see their definition again.
function ghostify(word){
  const gi = LEVELS.findIndex(l=>l.words.includes(word));
  const s = esc(word.sentence), sl = s.toLowerCase();
  const hwAt = sl.indexOf(word.word.toLowerCase());
  const hwEnd = hwAt<0 ? -1 : hwAt+word.word.length;
  const ranges=[];
  LEVELS.slice(0, Math.max(gi,0)).forEach(l=>l.words.forEach(ew=>{
    const stem = (ew.word.length>=6 ? ew.word.slice(0,-1) : ew.word).toLowerCase();
    const at = sl.indexOf(stem);
    if(at<0) return;
    let end=at+stem.length; while(end<s.length && /[a-zA-Z]/.test(s[end])) end++;
    let start=at; while(start>0 && /[a-zA-Z]/.test(s[start-1])) start--;
    if(!s.slice(start,end).toLowerCase().startsWith(stem)) return;
    if(hwAt>=0 && start<hwEnd && end>hwAt) return;                    // overlaps headword
    if(ranges.some(r=>start<r.end && end>r.start)) return;            // overlaps a prior ghost
    ranges.push({start,end,def:esc(ew.word)+' — '+esc(ew.def)});
  }));
  ranges.sort((a,b)=>b.start-a.start);                                 // splice right-to-left
  let out=s;
  ranges.forEach(r=>{
    out = out.slice(0,r.start)
      + `<button class="ghost" data-def="${r.def}">${out.slice(r.start,r.end)}</button>`
      + out.slice(r.end);
  });
  return out;
}
document.addEventListener('click', e=>{
  const g = e.target.closest && e.target.closest('.ghost');
  if(!g) return;
  const note = g.closest('.exline').querySelector('.ghost-note');
  const txt = g.dataset.def;
  if(note.style.display!=='none' && note.textContent===txt){ note.style.display='none'; return; }
  note.textContent = txt; note.style.display='block';
});

function studyScreen(idx,w){
  const lv=LEVELS[idx], word=lv.words[w], total=lv.words.length, last=w===total-1;
  // On first arrival, move the study block out of 'ahead' into the live queue budget.
  if(S && S.sit && !S.sit.studyEntered){ S.sit.ahead -= total; S.studyLeft = total; S.sit.studyEntered=true; }
  // Reconcile bar: cleared study words = total - studyLeft; queue is empty during study,
  // so temporarily represent remaining study as queue-length via studyLeft.
  const remaining = (S&&S.studyLeft!==undefined?S.studyLeft:0) + (S&&S.sit?S.sit.ahead:0);
  const frac = S&&S.sit ? S.sit.cleared/((S.sit.cleared+remaining)||1) : w/total;
  setMark({stage:'study', idx, w, kind:'T1',
    sit: S&&S.sit ? {cleared:S.sit.cleared, ahead:S.sit.ahead, studyEntered:true} : undefined,
    studyLeft: S ? S.studyLeft : undefined});
  app.innerHTML=`<section class="panel">
    <button class="back" id="home">← The Gates</button>
    <div class="stage-label">Gate ${rom(lv.id)} · Study — word ${w+1} of ${total}</div>
    ${stageBar(frac)}
    ${cardHtml(word)}
    <div class="actions">
      ${w>0?'<button class="btn ghost" id="prev">← Back</button>':''}
      <button class="btn" id="next">${last?'Trial I →':'Next word →'}</button>
    </div></section>`;
  document.getElementById('home').onclick=home;
  document.getElementById('next').onclick=()=>{
    if(S&&S.sit){ S.sit.cleared++; S.studyLeft=Math.max(0,(S.studyLeft||total)-1); }
    last?startTrial1(idx):studyScreen(idx,w+1);
  };
  const pv=document.getElementById('prev'); if(pv) pv.onclick=()=>{
    if(S&&S.sit){ S.sit.cleared=Math.max(0,S.sit.cleared-1); S.studyLeft=(S.studyLeft||0)+1; }
    studyScreen(idx,w-1);
  };
}

/* ================= TRIALS ================= */
function startTrial1(idx){
  const lv=LEVELS[idx];
  let items=[]; lv.words.forEach((_,wi)=>{items.push({gi:idx,wi,m:'REC'},{gi:idx,wi,m:'REV'},{gi:idx,wi,m:'VIG'});});
  if(idx>=3) inferPick(idx,1).forEach(f=>items.push({m:'INFER',inf:f}));
  const sit = (S&&S.sit)?S.sit:{cleared:0,ahead:0};
  sit.ahead=0; sit.studyEntered=true;                 // trial I is the last stage of sitting 1
  S={idx,kind:'T1',queue:shuffle(items),debt:0,done:0,sit,studyLeft:0,missed:[]};
  trialItem();
}
function startTrial2(idx){
  const lv=LEVELS[idx];
  let items=lv.words.map((_,wi)=>({gi:idx,wi,m:'PROD'}));
  // review injections from sealed gates — affinity-scored: prefer words whose gate
  // shares root stock with the current gate (contrast over random repetition)
  const pool=[]; LEVELS.slice(0,idx).forEach((pl,pi)=>{ if(G(pl.id).sealed) pl.words.forEach((_,wi)=>pool.push({gi:pi,wi})); });
  const cur=gateRootKeys(idx);
  pool.map(r=>{ let s=0; gateRootKeys(r.gi).forEach(t=>{ if(cur.has(t)) s++; }); return {r,s:s+Math.random()*0.5}; })
      .sort((a,b)=>b.s-a.s).slice(0,4)
      .forEach(x=>items.push({...x.r, m:Math.random()<.5?'PROD':'VIGT'}));
  if(idx>=3) inferPick(idx,2).forEach(f=>items.push({m:'INFER',inf:f}));
  // confusable pairs: both members taught by now
  const pairs = shuffle(CONFUSABLES.filter(p=>pairEligible(p,idx))).slice(0,3);
  pairs.forEach(p=>items.push({m:'PAIR',pair:p}));
  S={idx,kind:'T2',queue:shuffle(items),debt:0,done:0,sit:{cleared:0,ahead:0},missed:[]};
  trialItem();
}

function trialItem(){
  const lv=LEVELS[S.idx];
  if(S.queue.length===0) return trialDone();
  markSit('trial');
  const it=S.queue[0];
  const label = S.kind==='T1'?'Trial I':'Trial II';
  renderTrialPrompt({
    label:'Gate '+rom(lv.id)+' · '+label,
    gateLabel: it.gi!==undefined && it.gi!==S.idx ? 'Review · Gate '+rom(LEVELS[it.gi].id) : '',
    it, w: (it.m==='PAIR'||it.m==='INFER')?null:wordAt(it.gi,it.wi),
    onResolve: ok=>{
      if(it.gi!==undefined) tally(it.gi,it.wi,ok);
      if(ok){ S.queue.shift(); S.done++; if(S.sit)S.sit.cleared++; }
      else { const f=S.queue.shift(); S.queue.push(f); S.queue.push({...f}); S.debt++;
        S.missed.push(it.m==='PAIR'?it.pair.ans : it.m==='INFER'?it.inf.word : wordAt(it.gi,it.wi).word); }
      return ok?null:'it returns to the queue, plus a penalty rep';
    },
    onNext: trialItem
  });
}

/* Shared prompt renderer: REC / REV / BLANK / PROD / PAIR / INFER */
function renderTrialPrompt({label,gateLabel,it,w,onResolve,onNext,oneShot}){
  if(it.inf){ P.seenInfer[it.inf.word]=1; save(); }
  let promptHtml='',bodyHtml='',typed=false;
  const L=['A','B','C','D'];
  if(it.m==='REC'){
    promptHtml=`<div class="q-ask">What does it mean?</div><div class="q-word">${w.word}</div>`;
    const opts=shuffle([{t:w.def,ok:true},...w.distractors.map(t=>({t,ok:false}))]);
    bodyHtml=`<div class="choices">${opts.map((o,i)=>`<button class="choice" data-ok="${o.ok}"><span class="mark">${L[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
  } else if(it.m==='REV'){
    const gate=LEVELS[it.gi];
    promptHtml=`<div class="q-ask">Which word fits?</div><div class="q-def">“${w.def}”</div>`;
    const others=shuffle(gate.words.filter(x=>x.word!==w.word)).slice(0,3).map(x=>x.word);
    const opts=shuffle([{t:w.word,ok:true},...others.map(t=>({t,ok:false}))]);
    bodyHtml=`<div class="choices">${opts.map((o,i)=>`<button class="choice" data-ok="${o.ok}"><span class="mark">${L[i]}</span><span style="font-family:'IBM Plex Mono',monospace">${o.t}</span></button>`).join('')}</div>`;
  } else if(it.m==='PAIR'){
    const p=it.pair;
    promptHtml=`<div class="q-ask">Near twins — which one fits?</div><div class="q-sentence">“${esc(p.s).replace('___','<b>＿＿＿＿</b>')}”</div>`;
    const opts=shuffle([p.a,p.b]);
    bodyHtml=`<div class="choices">${opts.map((o,i)=>`<button class="choice" data-ok="${o===p.ans}"><span class="mark">${L[i]}</span><span style="font-family:'IBM Plex Mono',monospace">${o}</span></button>`).join('')}</div>`;
  } else if(it.m==='INFER'){
    const inf=it.inf;
    promptHtml=`<div class="q-ask">Never taught — build it from its roots</div><div class="q-word">${inf.word}</div>`;
    const opts=shuffle([{t:inf.def,ok:true},...inf.distractors.map(t=>({t,ok:false}))]);
    bodyHtml=`<div class="choices">${opts.map((o,i)=>`<button class="choice" data-ok="${o.ok}"><span class="mark">${L[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
  } else if(it.m==='COMPOSE'){
    const src = it.inf || w;
    const segs = src.parts.map(p=>p[0]);
    let dpool=[];
    if(it.inf){ INFER_POOL.forEach(f=>{ if(f.word!==src.word) f.parts.forEach(p=>{ if(p[0].length>1) dpool.push(p[0]); }); }); }
    else { LEVELS[it.gi].words.forEach(x=>{ if(x.word!==w.word) x.parts.forEach(p=>{ if(p[0].length>1) dpool.push(p[0]); }); }); }
    dpool = shuffle([...new Set(dpool)].filter(s=>!segs.includes(s))).slice(0,3);
    const bank = shuffle([...segs, ...dpool]);
    promptHtml=`<div class="q-ask">Assemble the word — ${segs.length} pieces, in order</div><div class="q-def">“${src.def}”</div>`;
    bodyHtml=`<div class="built" id="built">&nbsp;</div>
      <div class="chipbank">${bank.map((s,i)=>`<button class="chip" data-seg="${esc(s)}">${s}</button>`).join('')}</div>
      <div class="typebox" style="justify-content:center"><button class="btn ghost" id="clr">Clear</button></div>`;
    it._compose = { segs, target: src.word };
  } else if(it.m==='VIG'){
    const gate=LEVELS[it.gi];
    const scene=vigOf(w)||w.def;
    promptHtml=`<div class="q-ask">Read the scene — which word does it call for?</div><div class="q-sentence">“${esc(scene)}”</div>`;
    const others=shuffle(gate.words.filter(x=>x.word!==w.word)).slice(0,3).map(x=>x.word);
    const opts=shuffle([{t:w.word,ok:true},...others.map(t=>({t,ok:false}))]);
    bodyHtml=`<div class="choices">${opts.map((o,i)=>`<button class="choice" data-ok="${o.ok}"><span class="mark">${L[i]}</span><span style="font-family:'IBM Plex Mono',monospace">${o.t}</span></button>`).join('')}</div>`;
  } else { // VIGT or PROD — typed exact
    typed=true;
    promptHtml = it.m==='VIGT' && vigOf(w)
      ? `<div class="q-ask">Name the word the scene calls for — exact spelling</div><div class="q-sentence">“${esc(vigOf(w))}”</div><div class="cue">${letterCue(w.word)}</div>`
      : `<div class="q-ask">Type the word — exact spelling</div><div class="q-def">“${w.def}”</div>`;
    bodyHtml=`<div class="typebox"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="the word…"><button class="btn" id="sub">Submit</button></div>`;
  }

  app.innerHTML=`<section class="panel">
    <button class="back" id="home">← The Gates</button>
    <div class="stage-label">${label}</div>
    ${oneShot ? stageBar(S.pos/S.queue.length) : sitBar()}
    <div class="queue-meta"><span>${S.queue.length} ${oneShot?'· item '+(S.pos+1):'in queue'}</span><span class="debt">${S.debt?'+'+S.debt+' penalty reps':''}</span></div>
    <div class="prompt">${gateLabel?`<div class="review-tag">${gateLabel}</div>`:''}${promptHtml}</div>
    ${bodyHtml}
    <div class="verdict" id="v"></div><div class="actions" id="a"></div></section>`;
  document.getElementById('home').onclick=home;

  const finish = (ok,picked)=>{
    const extra = onResolve(ok);
    const v=document.getElementById('v');
    let hint='';
    if(it.m==='PAIR') hint=`<span class="root-hint">${it.pair.why}</span>`;
    else if(it.m==='INFER') hint=`<span class="root-hint">${it.inf.roots}</span>`;
    else if(it.m==='COMPOSE'){ const src=it.inf||w;
      hint=`<span class="root-hint">${src.parts.map(p=>p[0]+(p[1]?' ('+p[1]+')':'')).join(' + ')}</span>`; }
    else if(w) hint=`<span class="root-hint">${rootHint(w)}</span>`;
    if(ok){ v.className='verdict right'; v.innerHTML='Correct.'+hint;
      const sess=S; setTimeout(()=>{ if(S===sess) onNext(); },350); }
    else {
      const answer = it.m==='PAIR'?it.pair.ans : it.m==='INFER'?it.inf.def : it.m==='COMPOSE'?(it.inf||w).word : w.word;
      let deep='';
      if(w){
        const pd = picked && picked!==w.word ? defOfWord(picked) : '';
        if(pd) deep+=`<span class="fb-line fb-contrast">not <b>${picked}</b> — ${pd.toLowerCase()}</span>`;
        if(etyOf(w)) deep+=`<span class="fb-line fb-ety">${etyOf(w)}</span>`;
        if(vigOf(w) && it.m!=='VIG' && it.m!=='VIGT') deep+=`<span class="fb-line fb-scene">“${esc(vigOf(w))}”</span>`;
      }
      v.className='verdict wrong';
      v.innerHTML=`<b>${answer}</b>${extra?' — '+extra:''}.${hint}${deep}`;
      document.getElementById('a').innerHTML=`<button class="btn" id="n">${(S.queue.length&&!oneShot)||(oneShot&&S.pos<S.queue.length)?'Next →':'Finish →'}</button>`;
      document.getElementById('n').onclick=onNext;
      document.getElementById('n').focus(); }
  };

  if(it.m==='COMPOSE'){
    const c=it._compose; let picked=[], done=false;
    const built=document.getElementById('built');
    const chips=[...document.querySelectorAll('.chip')];
    const paint=()=>{ built.innerHTML = picked.length? picked.map(s=>`<span class="bseg">${s}</span>`).join('') : '&nbsp;'; };
    chips.forEach(ch=>{ ch.onclick=()=>{ if(done||ch.disabled) return;
      picked.push(ch.dataset.seg); ch.disabled=true; paint();
      if(picked.length===c.segs.length){ done=true;
        const ok = picked.join('')===c.target;
        built.classList.add(ok?'ok':'bad');
        chips.forEach(x=>x.disabled=true);
        const clr=document.getElementById('clr'); if(clr) clr.disabled=true;
        finish(ok);
      } }; });
    document.getElementById('clr').onclick=()=>{ if(done) return;
      picked=[]; chips.forEach(x=>x.disabled=false); paint(); };
  } else if(typed){
    const input=document.getElementById('ans'), sub=document.getElementById('sub');
    input.focus();
    const check=()=>{ if(!input.value.trim())return;
      const ok=input.value.trim().toLowerCase()===w.word.toLowerCase();
      input.disabled=true; sub.disabled=true; input.classList.add(ok?'ok':'bad'); finish(ok); };
    sub.onclick=check; input.onkeydown=e=>{if(e.key==='Enter')check();};
  } else wireChoices(finish);
  applyVeil();
}

// Prediction veil: blur answer sets until the learner commits to a guess.
function applyVeil(){
  if(!P.predict) return;
  const t = document.querySelector('.choices, .chipbank');
  if(!t) return; // typed modalities: nothing to veil
  t.classList.add('veiled');
  const b = document.createElement('label');
  b.className='veil-prompt';
  const cb = document.createElement('input'); cb.type='checkbox';
  b.appendChild(cb);
  b.appendChild(document.createTextNode("What's your prediction?"));
  t.parentNode.insertBefore(b, t);
  cb.onchange = ()=>{ if(cb.checked){ t.classList.remove('veiled'); cb.disabled=true; } };
}
function wireChoices(resolve){
  const cs=[...document.querySelectorAll('.choice')];
  cs.forEach(c=>{ c.onclick=()=>{
    if(c.classList.contains('locked'))return;
    cs.forEach(x=>x.classList.add('locked'));
    const ok=c.dataset.ok==='true';
    c.classList.add(ok?'correct':'wrong');
    if(!ok) cs.find(x=>x.dataset.ok==='true').classList.add('correct');
    const pickedSpans=c.querySelectorAll('span');
    resolve(ok, pickedSpans[1]?pickedSpans[1].textContent:''); };});
}

function trialDone(){
  const lv=LEVELS[S.idx], g=G(lv.id);
  clearMark(S.idx);
  const weak = [...new Set(S.missed)];
  const weakLine = weak.length ? ' Weak words — give them a second look: ' + weak.join(', ') + '.' : '';
  if(S.kind==='T1'){ g.t1=Date.now(); save(); return temperScreen(S.idx, weak); }
  g.sealed=true; save();
  enqueueGateReview(S.idx);
  const isLast=allSealed();
  sealScreen({seal:rom(lv.id),title:'Gate Sealed',
    score:'queue cleared · '+(S.debt?S.debt+' penalty reps paid':'no errors'),
    note: (isLast?`All ${LEVELS.length} gates are sealed. Clear the Docket, then the Bar sits open — fifty items, one attempt.`
               :'Gate '+rom(lv.id)+' is sealed and its words enter the Review Docket. The next gate opens once the Docket is clear.') + weakLine,
    actions:`<button class="btn" id="h2">Return to the gates</button>`});
  document.getElementById('h2').onclick=home;
}

function temperScreen(idx, weak){
  stopClock();
  const lv=LEVELS[idx];
  const render=()=>{
    const left=temperUnlock(G(lv.id).t1)-Date.now();
    if(left<=0){stopClock();return startTrial2(idx);}
    app.innerHTML=`<section class="panel seal-wrap">
      <button class="back" id="home" style="display:block;text-align:left">← The Gates</button>
      <div class="stage-label">Gate ${rom(lv.id)} · Tempering</div>
      <div class="grad-title">Trial I is passed.</div>
      <p class="grad-note">A word learned in one sitting is a word half-learned. Sleep is where it sets. Trial II — typed production, exact spelling, with review and confusable pairs — opens after a night, in:</p>
      <div class="temper-clock" id="clk">${fmtDur(left)}</div>
      ${weak&&weak.length?`<p class="grad-note" style="color:var(--ox)">Weak words this sitting: ${weak.join(', ')}. Read their cards once more before you close the book.</p>`:''}
      <p class="grad-note">Close the book. Use the words aloud today. Sleep, then return in the morning.</p>
      <div class="actions"><button class="btn ghost" id="restudy">Re-read the cards meanwhile</button></div></section>`;
    document.getElementById('home').onclick=home;
    document.getElementById('restudy').onclick=()=>{stopClock();studyReview(idx);};
  };
  render();
  clockTimer=setInterval(()=>{
    const el=document.getElementById('clk');
    if(!el){stopClock();return;}
    const left=temperUnlock(G(lv.id).t1)-Date.now();
    if(left<=0){stopClock();startTrial2(idx);} else el.textContent=fmtDur(left);
  },1000);
}

function studyReview(idx){
  const lv=LEVELS[idx]; let w=0;
  const draw=()=>{
    app.innerHTML=`<section class="panel">
      <button class="back" id="back">← Tempering clock</button>
      <div class="stage-label">Gate ${rom(lv.id)} · Review — ${w+1} of ${lv.words.length}</div>
      ${cardHtml(lv.words[w])}
      <div class="actions">
        ${w>0?'<button class="btn ghost" id="p">←</button>':''}
        ${w<lv.words.length-1?'<button class="btn" id="n">→</button>':''}
      </div></section>`;
    document.getElementById('back').onclick=()=>temperScreen(idx);
    const n=document.getElementById('n'); if(n)n.onclick=()=>{w++;draw();};
    const p=document.getElementById('p'); if(p)p.onclick=()=>{w--;draw();};
  };
  draw();
}

/* ================= THE BAR ================= */
function startBar(){
  stopClock();
  const pool=[]; LEVELS.forEach((lv,gi)=>lv.words.forEach((_,wi)=>pool.push({gi,wi})));
  const prod = shuffle(pool).slice(0,35).map(r=>({...r,m:Math.random()<.6?'PROD':'VIGT'}));
  const pairs = shuffle(CONFUSABLES).slice(0,5).map(p=>({m:'PAIR',pair:p}));
  const inf10 = inferPick(LEVELS.length-1,10);
  const infers = inf10.slice(0,5).map(f=>({m:'INFER',inf:f}));
  const comps  = inf10.slice(5,10).map(f=>({m:'COMPOSE',inf:f}));
  S={kind:'BAR',queue:shuffle([...prod,...pairs,...infers,...comps]),pos:0,correct:0,debt:0};
  barItem();
}
function barItem(){
  if(S.pos>=S.queue.length) return barDone();
  const it=S.queue[S.pos];
  const w = (it.m==='PAIR'||it.m==='INFER') ? null : wordAt(it.gi,it.wi);
  // one-shot renderer reusing shared prompt
  const origLen=S.queue.length;
  renderBarPrompt(it,w);
}
function renderBarPrompt(it,w){
  S.queueLenDisplay=S.queue.length;
  renderTrialPrompt({
    label:'The Bar · '+(S.pos+1)+' of '+BAR_SIZE,
    gateLabel: it.m==='PAIR'?'Confusables':it.m==='INFER'?'Inference':it.m==='COMPOSE'?'Assembly':'',
    it,w,oneShot:true,
    onResolve: ok=>{ if(it.gi!==undefined) tally(it.gi,it.wi,ok); if(ok)S.correct++; S.pos++; return null; },
    onNext: barItem
  });
  // patch the meta line for one-shot display
  const qm=document.querySelector('.queue-meta');
  if(qm) qm.innerHTML=`<span>${S.correct} correct</span><span class="debt">${BAR_PASS} needed · no second chances</span>`;
}
function barDone(){
  const passed=S.correct>=BAR_PASS;
  if(passed){ P.bar.passed=true; P.bar.passedAt=Date.now(); } else P.bar.lockedUntil=Date.now()+TEMPER_MIN_MS;
  save();
  sealScreen({gold:true,seal:passed?'✦':'—',
    title:passed?'Admitted':'Not This Sitting',
    score:S.correct+' of '+BAR_SIZE+' · '+BAR_PASS+' required',
    note:passed?'Forty produced from memory, five twins told apart, five strangers read by their roots. The method is yours.'
               :'The doors lock for eight hours. Work the Docket and the cards — the Bar re-samples when it reopens.',
    actions:`<button class="btn" id="h2">Return to the gates</button>`});
  document.getElementById('h2').onclick=home;
}

/* ================= SAVE / RESTORE ================= */
function serialize(){
  // compact, self-describing; base64 so it survives copy/paste cleanly
  const payload = {v:2, gates:P.gates, bar:P.bar, review:P.review, prompted:P.prompted, seenInfer:P.seenInfer, predict:P.predict, ledger:P.ledger};
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); }
  catch(e){ return JSON.stringify(payload); }
}
function deserialize(str){
  const s=str.trim(); if(!s) return null;
  let raw;
  try{ raw = decodeURIComponent(escape(atob(s))); }catch(e){ raw = s; } // tolerate raw JSON too
  let obj; try{ obj=JSON.parse(raw); }catch(e){ return null; }
  if(!obj || typeof obj!=='object' || !obj.gates) return null;
  return obj;
}
function closeModal(){ const m=document.getElementById('modal-scrim'); if(m) m.remove(); }


function backupModal(){
  const code=serialize();
  const scrim=document.createElement('div');
  scrim.className='modal-scrim'; scrim.id='modal-scrim';
  scrim.innerHTML=`<div class="modal">
    <h3>Backup Code</h3>
    <p>Copy this code and keep it somewhere safe. Paste it into Restore on any device to recover your progress as of this moment.</p>
    <textarea id="code" readonly style="min-height:110px">${code}</textarea>
    <div class="actions">
      <button class="btn" id="copy">Copy code</button>
      <button class="btn ghost" id="cancel">Done</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>`;
  document.body.appendChild(scrim);
  document.getElementById('cancel').onclick=closeModal;
  scrim.addEventListener('click',e=>{ if(e.target===scrim) closeModal(); });
  const ta=document.getElementById('code');
  ta.onclick=()=>ta.select();
  document.getElementById('copy').onclick=()=>{
    ta.select();
    const done=()=>{ document.getElementById('msg').textContent='Copied.'; };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done,()=>{ document.execCommand('copy'); done(); });
    else { document.execCommand('copy'); done(); }
  };
}
function restoreModal(){
  const scrim=document.createElement('div');
  scrim.className='modal-scrim'; scrim.id='modal-scrim';
  scrim.innerHTML=`<div class="modal">
    <h3>Restore Progress</h3>
    <p>Paste a saved code below. This replaces your current progress on this device.</p>
    <textarea id="code" placeholder="paste your code here…"></textarea>
    <div class="actions">
      <button class="btn" id="do">Restore</button>
      <button class="btn ghost" id="cancel">Cancel</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>`;
  document.body.appendChild(scrim);
  document.getElementById('cancel').onclick=closeModal;
  scrim.addEventListener('click',e=>{ if(e.target===scrim) closeModal(); });
  document.getElementById('do').onclick=()=>{
    const msg=document.getElementById('msg');
    const obj=deserialize(document.getElementById('code').value);
    if(!obj){ msg.className='msg bad'; msg.textContent='That code could not be read.'; return; }
    P.gates=obj.gates||{}; P.bar=obj.bar||{passed:false,lockedUntil:0};
    P.review=obj.review||{}; P.prompted=obj.prompted||{}; P.seenInfer=obj.seenInfer||{}; P.predict=obj.predict!==false; P.ledger=obj.ledger||{};
    save(); closeModal(); home();
  };
}

/* ================= LEXICON ================= */
function sealedWords(){ const out=[]; LEVELS.forEach((l,gi)=>{ if(G(l.id).sealed) l.words.forEach((w,wi)=>out.push({w,gi,wi})); }); return out; }
function lexiconBar(){
  const n=lexEntries().length;
  if(!n) return '';
  return `<button class="lex-bar" id="lex-btn"><span>✧ The Lexicon</span><span class="ct">${n} words in your keeping</span></button>`;
}
function lexEntries(){
  const out = sealedWords().map(x=>({key:x.w.word, g:x, inf:-1}));
  INFER_POOL.forEach((f,fi)=>{ if(P.seenInfer[f.word]) out.push({key:f.word, g:null, inf:fi}); });
  return out.sort((a,b)=>a.key.localeCompare(b.key));
}
function lexicon(q){
  const all=lexEntries();
  const ql=(q||'').toLowerCase();
  const defOf=e=>e.g?e.g.w.def:INFER_POOL[e.inf].def;
  const hits=ql?all.filter(e=>e.key.toLowerCase().includes(ql)||defOf(e).toLowerCase().includes(ql)):all;
  S=null; stopClock&&stopClock();
  app.innerHTML=`<section class="panel">
    <button class="back" id="home">← The Gates</button>
    <div class="stage-label">The Lexicon · ${all.length} words</div>
    <div class="typebox" style="margin:6px 0 14px"><input id="lexq" placeholder="search word or meaning…" value="${esc(q||'')}" autocomplete="off"></div>
    <div class="lex-list">${hits.map(e=>{
      if(e.g){
        const x=e.g, t=P.ledger[x.gi+'-'+x.wi];
        const led=t?`<span class="lex-led ${t.w>t.r?'bad':''}">${t.r}–${t.w}</span>`:'';
        return `<button class="lex-row" data-gi="${x.gi}" data-wi="${x.wi}"><span class="lex-w">${x.w.word}</span><span class="lex-d">${esc(x.w.def)}</span>${led}</button>`;
      }
      return `<button class="lex-row" data-inf="${e.inf}"><span class="lex-w">${e.key}</span><span class="lex-d">${esc(INFER_POOL[e.inf].def)}</span><span class="lex-led" style="color:var(--gild)">inferred</span></button>`;
    }).join('')||'<div class="grad-note">Nothing matches.</div>'}</div></section>`;
  document.getElementById('home').onclick=home;
  const inp=document.getElementById('lexq');
  inp.oninput=()=>{ const v=inp.value; clearTimeout(inp._t); inp._t=setTimeout(()=>lexicon(v),140); };
  if(q){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
  document.querySelectorAll('.lex-row').forEach(b=>b.onclick=()=>{
    if(b.dataset.inf!==undefined) inferView(+b.dataset.inf,q);
    else wordView(+b.dataset.gi,+b.dataset.wi,q);
  });
}
function inferView(fi,q){
  const f=INFER_POOL[fi];
  const morph=f.parts.map((p,i)=>{
    const seg=`<div class="seg ${p[1]===''?'empty':''}"><div class="sy">${p[0]}</div>${p[1]?`<div class="mn">${p[1]}</div>`:''}</div>`;
    return i<f.parts.length-1?seg+'<span class="plus">+</span>':seg;}).join('');
  app.innerHTML=`<section class="panel">
    <button class="back" id="back">← The Lexicon</button>
    <div class="stage-label">Inference · a meaning built from roots</div>
    <div class="card"><div class="headword">${f.word}</div>
      <div class="morph">${morph}</div><div class="def">${f.def}</div>
      <div class="near">${esc(f.roots)}</div></div>
  </section>`;
  document.getElementById('back').onclick=()=>lexicon(q||'');
}
function sealedGateView(idx){
  const lv=LEVELS[idx];
  const rows=lv.roots.map(r=>`<div class="root-row">
    <div><span class="root-key">${r.root}</span><span class="root-lang">${r.lang}</span></div>
    <div class="root-gloss">${r.gloss}</div></div>`).join('');
  const words=lv.words.map((w,wi)=>{
    const t=P.ledger[idx+'-'+wi];
    const led=t?`<span class="lex-led ${t.w>t.r?'bad':''}">${t.r}–${t.w}</span>`:'';
    return `<button class="lex-row" data-wi="${wi}"><span class="lex-w">${w.word}</span><span class="lex-d">${esc(w.def)}</span>${led}</button>`;
  }).join('');
  app.innerHTML=`<section class="panel">
    <button class="back" id="home">← The Gates</button>
    <div class="stage-label">Gate ${rom(lv.id)} · Sealed</div>
    <div class="stage-title">${lv.title}</div>
    <p class="theme">${lv.theme}</p>${rows}
    <div class="lex-list" style="margin-top:14px">${words}</div></section>`;
  document.getElementById('home').onclick=home;
  document.querySelectorAll('.lex-row').forEach(b=>b.onclick=()=>wordView(idx,+b.dataset.wi,'',()=>sealedGateView(idx)));
}

function wordView(gi,wi,q,backFn){
  const w=wordAt(gi,wi), t=P.ledger[gi+'-'+wi];
  app.innerHTML=`<section class="panel">
    <button class="back" id="back">← ${backFn?'Gate '+rom(LEVELS[gi].id):'The Lexicon'}</button>
    <div class="stage-label">Gate ${rom(LEVELS[gi].id)} · ${LEVELS[gi].title}</div>
    ${cardHtml(w)}
    ${t?`<div class="grad-note" style="text-align:center">lifetime: ${t.r} right · ${t.w} wrong</div>`:''}
  </section>`;
  document.getElementById('back').onclick=backFn||(()=>lexicon(q||''));
}

/* ================= THE FORGE ================= */
function weakWords(){
  return sealedWords().filter(x=>{ const t=P.ledger[x.gi+'-'+x.wi]; return t && t.w>=2 && t.w*2>=t.r; });
}
function forgeCard(){
  const wk=weakWords();
  if(!wk.length) return '';
  return `<button class="lvl-card" id="forge-btn">
    <div class="lvl-num">⚒</div>
    <div class="lvl-body"><h3>The Forge</h3>
    <p>${wk.length} ${wk.length===1?'word wants':'words want'} reworking</p></div>
    <span class="lvl-seal" style="color:var(--ox)">Open</span></button>`;
}
function startForge(){
  const items=weakWords().map(x=>({gi:x.gi,wi:x.wi,m:Math.random()<.5?'PROD':'COMPOSE'}));
  if(!items.length) return home();
  S={kind:'FORGE',queue:shuffle(items),debt:0,done:0,sit:{cleared:0,ahead:0}};
  forgeItem();
}
function forgeItem(){
  if(S.queue.length===0){
    const n=S.done;
    return sealScreen({seal:'⚒',title:'Forge Cleared',score:n+' words reworked'+(S.debt?' · '+S.debt+' penalty reps':''),
      note:'The tallies remember. Miss them less and they leave the Forge on their own.',
      actions:'<button class="btn" id="h2">The Gates →</button>'}) || (document.getElementById('h2').onclick=home);
  }
  const it=S.queue[0], w=wordAt(it.gi,it.wi);
  renderTrialPrompt({
    label:'The Forge', gateLabel:'Gate '+rom(LEVELS[it.gi].id), it, w,
    onResolve: ok=>{
      tally(it.gi,it.wi,ok);
      if(ok){ S.queue.shift(); S.done++; S.sit.cleared++; }
      else { const f=S.queue.shift(); S.queue.push(f); S.queue.push({...f}); S.debt++; }
      return ok?null:'it returns to the queue, plus a penalty rep';
    },
    onNext: forgeItem
  });
}

function sealScreen({seal,title,score,note,actions,gold}){
  app.innerHTML=`<section class="panel seal-wrap">
    <div class="wax ${gold?'gold':''}"><span>${seal}</span></div>
    <div class="grad-score">${score}</div>
    <div class="grad-title">${title}</div>
    <p class="grad-note">${note}</p>
    <div class="actions">${actions}</div></section>`;
}

home();

</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    const swSrc = `
      const CACHE='rootstock-v1';
      self.addEventListener('install', e => {
        self.skipWaiting();
        e.waitUntil(caches.open(CACHE).then(c => c.add(self.registration.scope)));
      });
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(hit => hit || fetch(e.request).then(res => {
            const copy = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, copy));
            return res;
          }).catch(() => caches.match(self.registration.scope)))
        );
      });
    `;
    const blob = new Blob([swSrc], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  });
}
</script>
